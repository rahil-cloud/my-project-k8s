apiVersion: apps/v1
kind: Deployment

metadata:
  name: mywebsite-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mywebsite

  template:
    metadata:
      labels:
        app: mywebsite

    spec:
      containers:
      - name: mywebsite
        image: your-dockerhub-username/mywebsite:v1
        ports:
        - containerPort: 80
