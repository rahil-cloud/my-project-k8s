<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Kubernetes Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: white;

            border-radius: 10px;

        }

            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #326CE5;

            border-radius: 5px;

<body>

    <div class="container">
        <h1>🚀 My First Kubernetes Project</h1>

        <p>Successfully deployed using Docker & Kubernetes</p>

        <div class="badge">

</html>
